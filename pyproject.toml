[project]
name = "inkstone"
version = "0.1.0"
description = "个人知识库收件箱：手机分享链接，抓成原文落本地，自动 git 存档"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "requests>=2.31",
    "trafilatura>=2.0",
    "PyYAML>=6.0",
    "pypdf>=5.0",
    "lark-oapi>=1.3",
]

[project.optional-dependencies]
# 视频：uv sync --extra video
video = [
    "yt-dlp>=2025.1.1",
    "faster-whisper>=1.0",
    "rapidocr-onnxruntime>=1.3",
    "opencv-python>=4.9",
    "numpy>=1.26",
    "zhconv>=1.4",
]

[tool.uv]
package = false
